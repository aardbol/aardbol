name: Profile cards

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics.yml
      - scripts/**

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-24.04
    steps:
      # Stars, repos, followers, contribution activity and joined date.
      - name: At a glance
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          filename: at-a-glance.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: aardbol
          template: classic
          base: header, activity, community, repositories, metadata
          config_display: large
          config_timezone: Europe/Madrid

      # Most used languages across repositories, with percentage details.
      - name: Languages
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          filename: languages.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: aardbol
          template: classic
          base: ""
          config_display: large
          config_timezone: Europe/Madrid
          plugin_languages: yes
          plugin_languages_ignored: css
          # Repositories excluded from the language byte counts.
          # First line enables minimatch patterns: "-" excludes, "+" re-includes,
          # "#" is a comment. Patterns match the lowercase "owner/repo" handle.
          plugin_languages_skipped: |
            @use.patterns
            -aardbol/secretshareweb
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8

      # Merged pull requests in projects you do not administer, rendered as a table.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Render upstream contributions
        run: node scripts/upstream-contributions.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_LOGIN: aardbol

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstream-contributions.svg upstream-contributions-dark.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "[skip ci] Update upstream contributions card"
            git push
          fi