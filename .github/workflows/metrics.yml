name: Profile cards

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      # Stars, forks, repos, followers, joined date and lines changed.
      - name: At a glance
        uses: lowlighter/metrics@latest
        with:
          filename: at-a-glance.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: aardbol
          template: classic
          base: header, activity, community, repositories, metadata
          config_display: large
          config_timezone: Europe/Madrid

      
      # Repositories you contributed to upstream (not your own), ranked by traction.
      - name: Upstream contributions
        uses: lowlighter/metrics@latest
        with:
          filename: upstream-contributions.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: aardbol
          template: classic
          base: ""
          config_display: large
          config_timezone: Europe/Madrid
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: commit, pull_request, issue
          plugin_notable_repositories: yes
          # Only projects with real traction, and show per-repo stats on each chip.
          plugin_notable_filter: "stars:>=100"
          plugin_notable_indepth: yes

      # Most used languages across repositories, with percentage details.
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          filename: languages.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: aardbol
          template: classic
          base: ""
          config_display: large
          config_timezone: Europe/Madrid
          plugin_languages: yes
          plugin_languages_ignored: css
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8